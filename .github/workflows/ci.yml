name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - 'web/**'

jobs:
  backend:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache tdlib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-linux
          key: tdlib-linux-x64-1.15.0

      - name: Download tdlib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/libs.zip https://github.com/p-vorobyev/spring-boot-starter-telegram/releases/download/1.15.0/libs.zip
          unzip -q /tmp/libs.zip -d /tmp/tdlib-extract
          mkdir -p tdlib-linux
          cp -r /tmp/tdlib-extract/libs/linux_x64/* tdlib-linux/

      - name: Create .env.test
        run: |
          mkdir -p /tmp/tf-test-data
          printf 'APP_ENV=dev\nAPP_ROOT=/tmp/tf-test-data\nTELEGRAM_API_ID=12345\nTELEGRAM_API_HASH=test-hash\nLOG_LEVEL=WARNING\nTELEGRAM_LOG_LEVEL=0\n' > ../.env.test

      - name: Run tests
        env:
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
        run: ./gradlew clean test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    runs-on: 'ubuntu-24.04'
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
        run: npm run build
