name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - 'web/**'
      - 'misc/**'
      - 'Dockerfile'
      - 'nginx.conf.template'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - 'web/**'
      - 'misc/**'
      - 'Dockerfile'
      - 'nginx.conf.template'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache tdlib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-linux
          key: tdlib-linux-x64-1.15.0

      - name: Download tdlib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/libs.zip https://github.com/p-vorobyev/spring-boot-starter-telegram/releases/download/1.15.0/libs.zip
          unzip -q /tmp/libs.zip -d /tmp/tdlib-extract
          mkdir -p tdlib-linux
          cp -r /tmp/tdlib-extract/libs/linux_x64/* tdlib-linux/

      - name: Create .env.test
        run: |
          mkdir -p /tmp/tf-test-data
          printf 'APP_ENV=dev\nAPP_ROOT=/tmp/tf-test-data\nTELEGRAM_API_ID=12345\nTELEGRAM_API_HASH=test-hash\nLOG_LEVEL=WARNING\nTELEGRAM_LOG_LEVEL=0\n' > ../.env.test

      - name: Run tests
        env:
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
        run: ./gradlew clean test

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend-pg-integration:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache tdlib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-linux
          key: tdlib-linux-x64-1.15.0

      - name: Download tdlib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/libs.zip https://github.com/p-vorobyev/spring-boot-starter-telegram/releases/download/1.15.0/libs.zip
          unzip -q /tmp/libs.zip -d /tmp/tdlib-extract
          mkdir -p tdlib-linux
          cp -r /tmp/tdlib-extract/libs/linux_x64/* tdlib-linux/

      - name: Create .env.test
        run: |
          mkdir -p /tmp/tf-test-data
          printf 'APP_ENV=dev\nAPP_ROOT=/tmp/tf-test-data\nTELEGRAM_API_ID=12345\nTELEGRAM_API_HASH=test-hash\nLOG_LEVEL=WARNING\nTELEGRAM_LOG_LEVEL=0\n' > ../.env.test

      # The pgIntegrationTest Gradle task starts a fixed-port PostgreSQL 17 container via the Docker
      # daemon (present on ubuntu runners) and exports its coordinates as real env vars the test JVM
      # sees, so Config's static-final DB fields resolve to Postgres. Each test asserts it reached
      # Postgres, so a silent SQLite fallback fails the job.
      - name: Run PostgreSQL integration tests
        env:
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
        run: ./gradlew pgIntegrationTest

  frontend:
    runs-on: 'ubuntu-24.04'
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's webServer reuses the out/ built above and serves it via the static server.
      - name: Run Playwright smoke tests
        env:
          CI: '1'
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  # Phase-6 WebSocket EXACTLY-ONCE gate (BL-02). Builds the backend fat jar, then runs the hermetic
  # dev-mode probes: the node frame-exactly-once + reconnect/stale-close probe (boots the jar itself),
  # and the Playwright progress-render spec (real built frontend + real backend + hermetic gateway).
  # Both run against a DEV-MODE backend (APP_ENV=dev, HERMETIC_GATEWAY=1) — the injector is hard-off
  # under prod, so this never runs the injector in a prod build.
  ws-dedup-probe:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache tdlib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: api/tdlib-linux
          key: tdlib-linux-x64-1.15.0

      - name: Download tdlib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          wget -q -O /tmp/libs.zip https://github.com/p-vorobyev/spring-boot-starter-telegram/releases/download/1.15.0/libs.zip
          unzip -q /tmp/libs.zip -d /tmp/tdlib-extract
          mkdir -p api/tdlib-linux
          cp -r /tmp/tdlib-extract/libs/linux_x64/* api/tdlib-linux/

      - name: Create .env.test
        run: |
          mkdir -p /tmp/tf-test-data
          printf 'APP_ENV=dev\nAPP_ROOT=/tmp/tf-test-data\nTELEGRAM_API_ID=12345\nTELEGRAM_API_HASH=test-hash\nLOG_LEVEL=WARNING\nTELEGRAM_LOG_LEVEL=0\n' > .env.test

      - name: Build backend fat jar
        working-directory: ./api
        env:
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
        run: ./gradlew shadowJar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # WS frame-exactly-once + reconnect/stale-close probe. Boots the jar itself in dev-mode and
      # connects a headless WS client directly to /ws; exits non-zero on any dedup violation.
      - name: WS exactly-once dedup probe (frame + reconnect/stale-close)
        env:
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: deadbeefdeadbeefdeadbeefdeadbeef
        run: node misc/acceptance/ws-dedup-probe.mjs

      - name: Install frontend deps
        working-directory: ./web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install --with-deps chromium

      # Progress-render DOM probe: a real progress event renders in a file row and the row completes
      # exactly once. Uses playwright.download.config.ts, which boots the backend (dev-mode hermetic).
      - name: WS progress-render + complete-once Playwright probe
        working-directory: ./web
        env:
          CI: '1'
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_WS_URL: /ws
          TDLIB_PATH: ${{ github.workspace }}/api/tdlib-linux
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: deadbeefdeadbeefdeadbeefdeadbeef
        run: npx playwright test --config=playwright.download.config.ts ws-progress.spec.ts

      - name: Upload probe Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-probe-playwright-report
          path: web/playwright-report/
          retention-days: 7
