plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'jacoco'
}

group = 'telegram.files'
version = '0.4.6-fms'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

ext {
    vertxVersion = '5.0.0'
}

dependencies {
    def osName = System.getProperty("os.name").toLowerCase()

    implementation "io.vertx:vertx-core:$vertxVersion"
    implementation "io.vertx:vertx-web:$vertxVersion"
    implementation "io.vertx:vertx-jdbc-client:$vertxVersion"
    implementation "io.vertx:vertx-sql-client-templates:$vertxVersion"
    implementation "io.vertx:vertx-health-check:$vertxVersion"
    implementation "io.vertx:vertx-pg-client:$vertxVersion"
    implementation "io.vertx:vertx-mysql-client:$vertxVersion"
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.ongres.scram:scram-client:3.1'
    implementation 'io.agroal:agroal-api:1.16'
    implementation 'io.agroal:agroal-pool:1.16'
    implementation 'cn.hutool:hutool-core:5.8.34'
    implementation 'cn.hutool:hutool-log:5.8.34'
    implementation 'org.jooq:jool:0.9.15'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
    implementation 'org.apache.commons:commons-jexl3:3.6.1'
    implementation 'com.openai:openai-java:4.13.0'
    // only for macos
    if (osName.contains("mac")) {
        implementation('io.netty:netty-resolver-dns-native-macos:4.2.0.Final') {
            artifact {
                name = 'netty-resolver-dns-native-macos'
                type = 'jar'
                classifier = System.getProperty("os.arch").contains("aarch64") ? "osx-aarch_64" : "osx-x86_64"
            }
        }
    }

    testImplementation "io.vertx:vertx-junit5:$vertxVersion"
    testImplementation "io.vertx:vertx-web-client:$vertxVersion"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.postgresql:postgresql:42.7.4'
}

// Load key=value pairs from ../.env.test (if present) onto a test task's environment.
def applyEnvTestFile = { testTask ->
    def envFile = file('../.env.test')
    if (envFile.exists()) {
        testTask.doFirst {
            envFile.eachLine {
                if (!it.startsWith("#") && !it.isEmpty()) {
                    def (key, value) = it.tokenize('=')
                    testTask.environment key, value
                }
                return
            }
        }
    }
}

test {
    applyEnvTestFile(delegate)
    jvmArgs "-Djava.library.path=${System.getenv('TDLIB_PATH')}",
            "-XX:+EnableDynamicAgentLoading",
            "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
    environment "APP_ROOT", layout.buildDirectory.dir("test-data").get().asFile.absolutePath
    // Default suite stays on SQLite; PG-only integration tests run under pgIntegrationTest.
    useJUnitPlatform {
        excludeTags 'pg-integration'
    }
    doFirst {
        jvmArgs "-Djava.class.path=${classpath.asPath}"
    }
    finalizedBy jacocoTestReport
}

// PostgreSQL 17 integration suite.
//
// Config reads DB selection from System.getenv into static-final fields at class-load, and
// JVM system properties do NOT populate System.getenv. A testcontainers Postgres whose port is
// assigned at runtime therefore cannot be injected via -D sysprops, and a misconfigured fixture
// would silently fall back to SQLite (false green). So this task starts a fixed-port PostgreSQL
// 17 container BEFORE the test JVM forks, then exports the container coordinates as REAL
// environment variables the test JVM's System.getenv sees. Each PG test asserts it actually
// reached Postgres, so a silent SQLite fallback fails loudly.
def pgContainerName = 'tf-pg-itest'
def pgHostPort = '55432'
def pgUser = 'telegram_user'
def pgPassword = 'telegram_pass'
def pgBootstrapDb = 'postgres'

tasks.register('pgIntegrationTest', Test) {
    description = 'Runs PostgreSQL-backed integration tests against a testcontainers Postgres 17.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    applyEnvTestFile(delegate)
    jvmArgs "-Djava.library.path=${System.getenv('TDLIB_PATH')}",
            "-XX:+EnableDynamicAgentLoading",
            "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
    environment "APP_ROOT", layout.buildDirectory.dir("pg-test-data").get().asFile.absolutePath

    // Real env vars so Config's static-final DB fields resolve to Postgres (never sysprops).
    environment "DB_TYPE", "postgres"
    environment "DB_HOST", "127.0.0.1"
    environment "DB_PORT", pgHostPort
    environment "DB_USER", pgUser
    environment "DB_PASSWORD", pgPassword
    environment "DB_NAME", pgBootstrapDb
    environment "DB_NEED_CREATE", "false"

    useJUnitPlatform {
        includeTags 'pg-integration'
    }

    doFirst {
        jvmArgs "-Djava.class.path=${classpath.asPath}"

        exec { commandLine 'docker', 'rm', '-f', pgContainerName; ignoreExitValue = true }
        exec {
            commandLine 'docker', 'run', '-d', '--name', pgContainerName,
                    '-e', "POSTGRES_USER=${pgUser}",
                    '-e', "POSTGRES_PASSWORD=${pgPassword}",
                    '-e', "POSTGRES_DB=${pgBootstrapDb}",
                    '-p', "${pgHostPort}:5432",
                    'postgres:17'
        }
        // Block until Postgres accepts connections (pg_isready), fail loudly if it never does.
        def ready = false
        for (int i = 0; i < 60; i++) {
            def probe = exec {
                commandLine 'docker', 'exec', pgContainerName,
                        'pg_isready', '-U', pgUser, '-d', pgBootstrapDb
                ignoreExitValue = true
            }
            if (probe.exitValue == 0) { ready = true; break }
            Thread.sleep(1000)
        }
        if (!ready) {
            exec { commandLine 'docker', 'logs', pgContainerName; ignoreExitValue = true }
            exec { commandLine 'docker', 'rm', '-f', pgContainerName; ignoreExitValue = true }
            throw new GradleException("PostgreSQL container did not become ready on port ${pgHostPort}")
        }
        logger.lifecycle("PostgreSQL 17 integration container ready on 127.0.0.1:${pgHostPort}")
    }

    finalizedBy 'pgIntegrationTestCleanup'
}

// Always tear the container down, even when pgIntegrationTest fails.
tasks.register('pgIntegrationTestCleanup') {
    doLast {
        exec { commandLine 'docker', 'rm', '-f', pgContainerName; ignoreExitValue = true }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = false
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: "org/drinkless/tdlib/**")
        })
    }
}

tasks.build {
    dependsOn shadowJar
}

shadowJar {
    archiveBaseName.set('telegram-files')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes(
                'Main-Class': 'telegram.files.Start'
        )
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Built-By': System.getProperty('user.name'),
                'Build-Time': new Date().format('yyyy-MM-dd HH:mm:ss'),
                'Git-Commit': getGitCommit()
        )
    }
}

static def getGitCommit() {
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (ignored) {
        return 'unknown'
    }
}
